<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>DoPlo12</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow-x: hidden; }

    /* Základní pozadí pro všechny zařízení */
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a0b2e, #0c0521);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      padding: 20px;
      position: relative;
    }

    /* Statické pozadí (fallback pro mobil) */
    .static-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(82, 39, 255, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 0, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(145, 70, 255, 0.2) 0%, transparent 50%),
        linear-gradient(135deg, #0c0521 0%, #1a0b2e 100%);
      z-index: 0;
      display: block;
    }

    /* Animované hvězdy pro lepší efekt */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Antigravity container - pouze pro PC */
    #antigravity-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Obsah */
    .card-container {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Karta */
    .card {
      background-color: rgba(0, 0, 0, 0.85);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 35px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.3s ease;
    }
    
    .card:hover {
      transform: translateY(-5px);
    }
    
    .card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid rgba(255, 255, 255, 0.8);
      object-fit: cover;
      box-shadow: 0 0 20px rgba(82, 39, 255, 0.5);
    }
    
    .card h1 { 
      font-size: 28px; 
      margin-bottom: 10px; 
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fff, #a366ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .card p { 
      font-size: 16px; 
      margin-bottom: 20px; 
      line-height: 1.5;
      color: #e0e0e0;
    }
    
    /* Sociální odkazy */
    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      color: white;
      font-size: 26px;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .links a:hover { 
      transform: scale(1.2) translateY(-3px); 
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px currentColor;
    }
    
    .youtube:hover { box-shadow: 0 0 20px #ff0000; }
    .twitch:hover { box-shadow: 0 0 20px #9146ff; }
    .discord:hover { box-shadow: 0 0 20px #7289da; }

    /* Tlačítka */
    .toggle-button {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 16px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      overflow: hidden;
    }
    
    .toggle-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }
    
    .toggle-button:hover::before {
      left: 100%;
    }
    
    .toggle-button:hover { 
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    
    /* Speciální tlačítko pro HV */
    .hv-button {
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.3), rgba(145, 70, 255, 0.3));
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-top: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    
    .hv-button:hover {
      background: linear-gradient(135deg, rgba(255, 0, 0, 0.5), rgba(145, 70, 255, 0.5));
      box-shadow: 0 5px 20px rgba(145, 70, 255, 0.4);
    }

    /* Panely */
    .toggle-panel {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.5s ease, opacity 0.5s ease, padding 0.5s ease;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      color: white;
      border-radius: 12px;
      text-align: left;
      padding: 0 15px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .toggle-panel.show {
      max-height: 800px;
      opacity: 1;
      padding: 20px;
    }
    
    .toggle-panel h3 {
      margin-bottom: 12px;
      text-align: center;
      text-transform: uppercase;
      font-family: 'Poppins', sans-serif;
      color: #fff;
      font-size: 18px;
    }
    
    .toggle-panel p {
      font-size: 15px;
      line-height: 1.6;
      text-align: center;
      color: #e0e0e0;
    }

    /* Mobilní úpravy */
    @media (max-width: 768px) {
      body {
        padding: 10px;
        background: #0c0521;
      }
      
      /* Skryj Antigravity na mobilech */
      #antigravity-container {
        display: none !important;
      }
      
      /* Zobraz statické pozadí na mobilech */
      .static-background {
        display: block !important;
      }
      
      /* Přidej hvězdy na mobil */
      .stars {
        display: block !important;
      }
      
      .card-container {
        padding: 10px;
      }
      
      .card { 
        max-width: 100%; 
        width: 100%; 
        padding: 30px 20px; 
        margin-top: 0;
      }
      
      .card img { 
        width: 100px; 
        height: 100px; 
      }
      
      .card h1 { 
        font-size: 24px; 
      }
      
      .card p { 
        font-size: 14px; 
      }
      
      .links { 
        gap: 15px; 
      }
      
      .links a { 
        width: 55px; 
        height: 55px; 
        font-size: 24px; 
      }
      
      .toggle-button {
        font-size: 16px;
        padding: 14px 20px;
      }
      
      .toggle-panel p { 
        font-size: 14px; 
      }
    }

    /* PC pouze - zobraz Antigravity */
    @media (min-width: 769px) {
      .static-background {
        display: none !important;
      }
      
      .stars {
        display: none !important;
      }
      
      #antigravity-container {
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <!-- Statické pozadí (pro mobil) -->
  <div class="static-background"></div>
  
  <!-- Hvězdy (pro mobil) -->
  <div class="stars" id="stars-container"></div>
  
  <!-- Antigravity pozadí (pouze PC) -->
  <div id="antigravity-container"></div>
  
  <!-- Hlavní obsah -->
  <div class="card-container">
    <div class="card">
      <img src="mimo provoz">
      <h1>DoPlo12</h1>
      <p>Tvůrce obsahu na Tiktok a komunita na Discordu. Sleduj mě a přidej se!</p>

      <div class="links">
        <a href="https://tiktok.com/@astcel.rants09" target="_blank" class="tiktok" title="DoPlo12"><i class="fab fa-tiktok"></i></a>
        <a href="https://tiktok.com/@dominik.plot" target="_blank" class="tiktok" title="Astcel Rants"><i class="fab fa-tiktok"></i></a>
        <a href="https://discord.gg/Cvf2cRtGex" target="_blank" class="discord" title="Discord"><i class="fab fa-discord"></i></a>
      </div>

      <!-- O mě -->
      <button class="toggle-button" onclick="toggleAccordion('aboutPanel')">O MĚ</button>
      <div class="toggle-panel" id="aboutPanel">
        <h3>O mě</h3>
        <p>brzy tu dám popis</p>
      </div>

  <script>
    // Vytvoření hvězd pro mobilní pozadí
    function createStars() {
      const starsContainer = document.getElementById('stars-container');
      if (!starsContainer) return;
      
      starsContainer.innerHTML = '';
      
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        
        // Náhodná pozice
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        
        // Náhodná velikost
        const size = Math.random() * 3 + 1;
        
        // Náhodná doba animace
        const duration = Math.random() * 5 + 2;
        const delay = Math.random() * 5;
        
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.left = `${x}%`;
        star.style.top = `${y}%`;
        star.style.animationDuration = `${duration}s`;
        star.style.animationDelay = `${delay}s`;
        
        starsContainer.appendChild(star);
      }
    }
    
    // Funkce pro rozbalování panelů
    function toggleAccordion(id) {
      const panels = document.querySelectorAll('.toggle-panel');
      panels.forEach(panel => {
        if(panel.id !== id) panel.classList.remove('show');
      });
      const panel = document.getElementById(id);
      panel.classList.toggle('show');
    }
    
    // Detekce zařízení
    function isMobileDevice() {
      return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
             window.innerWidth <= 768;
    }
    
    // Načtení Antigravity pouze na PC
    function loadAntigravityForPC() {
      if (isMobileDevice()) {
        console.log("Mobilní zařízení - používám statické pozadí");
        createStars();
        return;
      }
      
      console.log("PC zařízení - načítám Antigravity");
      
      // Dynamicky načíst skripty pouze pro PC
      const scripts = [
        'https://unpkg.com/react@18/umd/react.development.js',
        'https://unpkg.com/react-dom@18/umd/react-dom.development.js',
        'https://cdn.jsdelivr.net/npm/@justinmahar/react-particles-webgl@1.7.3/dist/umd/react-particles-webgl.min.js'
      ];
      
      let loadedScripts = 0;
      
      scripts.forEach(src => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = () => {
          loadedScripts++;
          if (loadedScripts === scripts.length) {
            initAntigravity();
          }
        };
        document.head.appendChild(script);
      });
    }
    
    // Inicializace Antigravity
    function initAntigravity() {
      try {
        if (!window.React || !window.ReactDOM || !window.ReactParticlesWebGL) {
          console.error("Knihovny nebyly načteny správně");
          createStars();
          return;
        }
        
        const { Antigravity } = window.ReactParticlesWebGL;
        const container = document.getElementById('antigravity-container');
        
        const App = () => {
          return window.React.createElement('div', {
            style: {
              width: '100%',
              height: '100%',
              position: 'relative'
            }
          }, window.React.createElement(Antigravity, {
            count: 600,
            magnetRadius: 50,
            ringRadius: 5,
            waveSpeed: 2.4,
            waveAmplitude: 1,
            particleSize: 1.1,
            lerpSpeed: 0.05,
            color: "#5227FF",
            autoAnimate: true,
            particleVariance: 1,
            rotationSpeed: 0.4,
            depthFactor: 1,
            pulseSpeed: 5.8,
            particleShape: "capsule",
            fieldStrength: 10,
            style: { width: '100%', height: '100%' }
          }));
        };
        
        const root = window.ReactDOM.createRoot(container);
        root.render(window.React.createElement(App));
        
      } catch (error) {
        console.error("Chyba při inicializaci Antigravity:", error);
        createStars();
      }
    }
    
    // Spuštění při načtení stránky
    document.addEventListener('DOMContentLoaded', function() {
      loadAntigravityForPC();
      
      // Reakce na změnu velikosti okna
      let resizeTimeout;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
          if (isMobileDevice()) {
            document.getElementById('antigravity-container').innerHTML = '';
            createStars();
          }
        }, 250);
      });
    });
  </script>
</body>
</html>
